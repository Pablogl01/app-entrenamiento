<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121315" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Entrenamiento</title>
    <script>
      // Modo de color antes del primer pintado: ajuste guardado o sistema.
      (function () {
        var theme = 'system'
        try { theme = localStorage.getItem('theme') || 'system' } catch (e) {}
        var dark = theme === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : theme === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#121315' : '#f8f7f4'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
